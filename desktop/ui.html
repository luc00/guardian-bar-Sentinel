<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Sentinel</title>
    <style>
      :root {
        --bg: #16181d; --card: #1d2026; --fg: #eceef2; --mut: #8b929e;
        --line: rgba(255,255,255,0.08); --ok: #3ee07f; --warn: #f0b429; --bad: #f2554b;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font: 13px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column;
        overflow: hidden; user-select: none;
      }
      header { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
      .logo { width: 30px; height: 30px; border-radius: 8px; background: rgba(62,224,127,.12); display: grid; place-items: center; color: var(--ok); font-size: 16px; }
      .title { font-weight: 600; letter-spacing: -.2px; }
      .sub { font: 10px/1.3 ui-monospace, monospace; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; }
      .hbtns { -webkit-app-region: no-drag; margin-left: auto; display: flex; gap: 2px; }
      .hbtns button { background: none; border: 0; color: var(--mut); padding: 6px; border-radius: 6px; cursor: pointer; font-size: 14px; }
      .hbtns button:hover { background: rgba(255,255,255,.07); color: var(--fg); }
      .hbtns button.on { color: var(--ok); background: rgba(62,224,127,.12); }
      .summary { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
      .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
      .stat b { display: block; font-size: 18px; }
      .stat span { font-size: 10px; color: var(--mut); }
      .s-ok b { color: var(--ok); } .s-warn b { color: var(--warn); } .s-bad b { color: var(--bad); }
      nav { display: flex; gap: 4px; padding: 10px 12px 0; }
      nav button { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--mut); padding: 6px; border-radius: 999px; font-size: 11px; cursor: pointer; }
      nav button.on { color: var(--ok); border-color: rgba(62,224,127,.45); }
      main { flex: 1; overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
      .item { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--mut); border-radius: 10px; padding: 9px 10px; }
      .item.safe { border-left-color: var(--ok); } .item.warn { border-left-color: var(--warn); } .item.danger { border-left-color: var(--bad); }
      .row { display: flex; align-items: baseline; gap: 6px; }
      .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tag { margin-left: auto; font: 9px/1 ui-monospace, monospace; padding: 3px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
      .safe .tag { background: rgba(62,224,127,.14); color: var(--ok); }
      .warn .tag { background: rgba(240,180,41,.14); color: var(--warn); }
      .danger .tag { background: rgba(242,85,75,.16); color: var(--bad); }
      .meta { font: 10px/1.4 ui-monospace, monospace; color: var(--mut); word-break: break-all; margin-top: 2px; }
      ul { margin: 6px 0 0; padding-left: 15px; color: #c6cad2; font-size: 12px; }
      .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
      .acts button { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--fg); padding: 4px 9px; border-radius: 7px; font-size: 11px; cursor: pointer; }
      .acts button:hover { border-color: var(--ok); color: var(--ok); }
      .acts button.bad:hover { border-color: var(--bad); color: var(--bad); }
      .empty, .loading { color: var(--mut); text-align: center; padding: 30px 10px; font-size: 12px; }
      footer { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--mut); }
      footer button { -webkit-app-region: no-drag; background: var(--ok); color: #0d2417; border: 0; padding: 5px 10px; border-radius: 7px; font-weight: 600; cursor: pointer; }
      #toast { position: fixed; left: 12px; right: 12px; bottom: 52px; background: #272b33; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 12px; display: none; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🛡</div>
      <div>
        <div class="title">Sentinel</div>
        <div class="sub" id="status">Avvio…</div>
      </div>
      <div class="hbtns">
        <button id="top" class="on" title="Sempre in primo piano">📌</button>
        <button id="hide" title="Nascondi nella barra">—</button>
        <button id="quit" title="Esci">✕</button>
      </div>
    </header>

    <div class="summary">
      <div class="stat s-bad"><b id="n-bad">0</b><span>pericoli</span></div>
      <div class="stat s-warn"><b id="n-warn">0</b><span>da guardare</span></div>
      <div class="stat s-ok"><b id="n-ok">0</b><span>a posto</span></div>
    </div>

    <nav>
      <button data-t="processes" class="on">Processi</button>
      <button data-t="connections">Rete</button>
      <button data-t="files">File</button>
    </nav>

    <main id="list"><div class="loading">Controllo in corso…</div></main>

    <div id="toast"></div>

    <footer>
      <button id="scan">Controlla ora</button>
      <button id="defender" style="background: #2c313a; color: var(--fg)">Scansione Defender</button>
      <span id="feed"></span>
    </footer>

    <script>
      const S = window.sentinel;
      let data = { processes: [], connections: [], files: [] };
      let tab = "processes";
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const LABEL = { safe: "a posto", warn: "attenzione", danger: "pericolo" };

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.style.display = "block";
        clearTimeout(t._h);
        t._h = setTimeout(() => (t.style.display = "none"), 5000);
      }

      async function act(fn, args) {
        toast("Eseguo…");
        const r = await S[fn](...args);
        toast(r.message || (r.ok ? "Fatto." : "Non riuscito."));
        if (r.ok) scan();
      }

      function render() {
        const items = data[tab] || [];
        const all = [...data.processes, ...data.connections, ...data.files];
        const c = (l) => all.filter((i) => i.judgement && i.judgement.level === l).length;
        $("n-bad").textContent = c("danger");
        $("n-warn").textContent = c("warn");
        $("n-ok").textContent = c("safe");

        const order = { danger: 0, warn: 1, safe: 2 };
        const sorted = [...items].sort((a, b) => order[a.judgement.level] - order[b.judgement.level]);
        if (!sorted.length) {
          $("list").innerHTML = '<div class="empty">Niente da mostrare.</div>';
          return;
        }
        $("list").innerHTML = sorted
          .map((i, idx) => {
            const lvl = i.judgement.level;
            let name, meta, acts = "";
            if (tab === "processes") {
              name = esc(i.name);
              meta = esc(i.path || "percorso non disponibile") + ` · ${i.mem ?? 0} MB`;
              acts = `<button class="bad" data-a="kill" data-i="${idx}">Chiudi processo</button>
                      <button data-a="blockProgram" data-i="${idx}">Blocca internet</button>
                      ${i.path ? `<button data-a="scanFile" data-i="${idx}">Scansiona</button><button data-a="folder" data-i="${idx}">Apri cartella</button>` : ""}`;
            } else if (tab === "connections") {
              name = i.state === "Listen" ? `Porta ${i.lport} in ascolto` : `${esc(i.remote)}:${i.rport}`;
              meta = `${esc(i.name || "?")} (PID ${i.pid}) · ${esc(i.state)}`;
              acts = `${i.state !== "Listen" ? `<button class="bad" data-a="blockIp" data-i="${idx}">Blocca indirizzo</button>` : ""}
                      <button class="bad" data-a="killConn" data-i="${idx}">Chiudi programma</button>`;
            } else {
              name = esc(i.name);
              meta = esc(i.dir) + ` · ${(i.size / 1024).toFixed(0)} KB · ${new Date(i.mtime).toLocaleString("it-IT")}`;
              acts = `<button class="bad" data-a="quarantine" data-i="${idx}">Metti in quarantena</button>
                      <button data-a="scanFile" data-i="${idx}">Scansiona</button>
                      <button data-a="folder" data-i="${idx}">Apri cartella</button>`;
            }
            const reasons = i.judgement.reasons.length ? `<ul>${i.judgement.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "";
            return `<div class="item ${lvl}" data-idx="${idx}">
              <div class="row"><span class="name">${name}</span><span class="tag">${LABEL[lvl]}</span></div>
              <div class="meta">${meta}</div>${reasons}
              <div class="acts">${acts}</div></div>`;
          })
          .join("");

        $("list").querySelectorAll("button[data-a]").forEach((b) => {
          b.onclick = () => {
            const i = sorted[+b.dataset.i];
            const a = b.dataset.a;
            if (a === "kill") act("kill", [i.pid, i.name]);
            if (a === "killConn") act("kill", [i.pid, i.name || "programma"]);
            if (a === "blockProgram") act("blockProgram", [i.path, i.name]);
            if (a === "blockIp") act("blockIp", [i.remote]);
            if (a === "quarantine") act("quarantine", [i.path]);
            if (a === "scanFile") act("defenderScan", [i.path]);
            if (a === "folder") S.openFolder(i.path);
          };
        });
      }

      async function scan() {
        $("status").textContent = "Controllo in corso…";
        data = await S.scan();
        if (data.platform !== "win32") $("status").textContent = "Solo su Windows";
        else $("status").textContent = "Protezione attiva · " + new Date().toLocaleTimeString("it-IT");
        $("feed").textContent = data.feed.total ? `${data.feed.total.toLocaleString("it-IT")} minacce note` : "elenco minacce non disponibile";
        render();
      }

      document.querySelectorAll("nav button").forEach((b) => {
        b.onclick = () => {
          tab = b.dataset.t;
          document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
          render();
        };
      });
      $("scan").onclick = scan;
      $("defender").onclick = () => act("defenderScan", [null]);
      $("hide").onclick = () => S.win("hide");
      $("quit").onclick = () => S.win("quit");
      $("top").onclick = async () => {
        const on = await S.win("top");
        $("top").classList.toggle("on", on);
      };

      scan();
      setInterval(scan, 60000);
    </script>
  </body>
</html>
